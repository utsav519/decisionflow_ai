services:
  mysql:
    image: mysql:8.0
    container_name: decisionflow-mysql
    environment:
      MYSQL_DATABASE: decisionflow
      MYSQL_USER: decisionflow
      MYSQL_PASSWORD: decisionflow
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - decisionflow_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  decisionflow_mysql_data:
